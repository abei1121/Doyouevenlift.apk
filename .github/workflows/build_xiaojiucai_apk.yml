name: Build XiaoJiuCai Android APK

on:
  push:
    paths:
      - 'xiaojiucai_app/**'
      - '.github/workflows/build_xiaojiucai_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Generate Release Keystore
        working-directory: xiaojiucai_app
        run: |
          mkdir -p app
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias xiaojiucai \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass xiaojiucai \
            -keypass xiaojiucai \
            -dname "CN=XiaoJiuCai, OU=Club, O=XiaoJiuCai, L=HK, ST=HK, C=CN"
          ls -la app/release.keystore

      - name: Build Release APK
        working-directory: xiaojiucai_app
        run: gradle assembleRelease --no-daemon --info

      - name: Stage APK to Root for jsDelivr CDN
        run: |
          APK_SRC="xiaojiucai_app/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "Error: $APK_SRC not found! Searching for any generated apk..."
            find xiaojiucai_app -name "*.apk"
            exit 1
          fi
          cp "$APK_SRC" Xiaojiucai1.0.0.apk
          ls -lh Xiaojiucai1.0.0.apk

      - name: Commit and Push APK
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Xiaojiucai1.0.0.apk
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(release): auto-compile Xiaojiucai1.0.0.apk via GitHub Actions"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaojiucai1.0.0.apk
          path: Xiaojiucai1.0.0.apk
          if-no-files-found: error
